<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>Taller Web I</title>

    <!-- Boostrap core css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

    <!-- custom style -->
    <link rel="stylesheet" th:href="@{/css/main.css}" />

</head>

<body>

<nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">
    <a class="navbar-brand" href="#">UNLAM</a>
</nav>

<main role="main" class="container">

    <div class="container" style="margin-top:50px;">
        <h3>Ejercicios</h3>
        <hr class="colorgraph">

        <a th:href="@{/ejercicios/nuevo}" class="btn btn-primary mb-3">Nuevo ejercicio</a>

        <table class="table table-striped">
            <thead>
            <tr>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Capacidad</th>
                <th>Dificultad</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="e : ${ejercicios}">
                <td th:text="${e.nombre}"></td>
                <td th:text="${e.descripcion}"></td>
                <td th:text="${e.capacidad}"></td>
                <td th:text="${e.dificultad}"></td>
            </tr>
            </tbody>
        </table>

        <p th:if="${#lists.isEmpty(ejercicios)}" class="text-muted">
            Todavía no hay ejercicios cargados.
        </p>
    </div>

</main>
<!-- /.container -->

<!-- Boostrap core js -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>

</body>

</html>
