<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos :: cabecera('Ejercicios')}"></head>

<body>

  <nav th:replace="~{fragmentos :: barra('ejercicios')}"></nav>

  <main role="main" class="pagina">
    <header class="pagina-cabecera">
      <div>
        <h1>Ejercicios</h1>
        <p>Las rutinas se arman con estos ejercicios, según la capacidad que trabajan.</p>
      </div>
      <a th:href="@{/ejercicios/nuevo}" class="btn btn-primary">Nuevo ejercicio</a>
    </header>

    <div class="tabla-responsive" th:unless="${#lists.isEmpty(ejercicios)}">
      <table class="tabla">
        <thead>
          <tr>
            <th>Ejercicio</th>
            <th>Capacidad</th>
            <th>Dificultad</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="e : ${ejercicios}">
            <td>
              <span class="principal" th:text="${e.nombre}">Sentadilla</span>
              <span class="secundario" th:if="${e.descripcion != null and !#strings.isEmpty(e.descripcion)}" th:text="${e.descripcion}">Descripción</span>
            </td>
            <td><th:block th:replace="~{fragmentos :: capacidad(${e.capacidad})}"></th:block></td>
            <td><th:block th:replace="~{fragmentos :: dificultad(${e.dificultad})}"></th:block></td>
          </tr>
        </tbody>
      </table>
    </div>

    <p th:if="${#lists.isEmpty(ejercicios)}" class="vacio">
      Todavía no hay ejercicios cargados.
      <a th:href="@{/ejercicios/nuevo}">Cargá el primero.</a>
    </p>
  </main>

  <th:block th:replace="~{fragmentos :: scripts}"></th:block>

</body>

</html>
