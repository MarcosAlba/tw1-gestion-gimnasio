<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos :: cabecera('Ingresar')}"></head>

<body>

  <nav th:replace="~{fragmentos :: barra('login')}"></nav>

  <main role="main" class="ingreso">
    <section class="ingreso-panel">
      <div class="ingreso-discos" aria-hidden="true">
        <i class="disco disco-fuerza"></i>
        <i class="disco disco-agilidad"></i>
        <i class="disco disco-cardio"></i>
        <i class="disco disco-coordinacion"></i>
      </div>
      <h1>Reservá tu clase y seguí tu rutina</h1>
      <p>Fuerza, agilidad, cardio y coordinación en un solo lugar.</p>
    </section>

    <section id="loginbox" class="ingreso-formulario">
      <h2 class="form-signin-heading">Ingresar</h2>
      <form class="formulario" action="#" th:action="@{/validar-login}" method="POST" th:object="${datosLogin}">
        <label class="campo-etiqueta" for="email">Email</label>
        <input th:field="*{email}" id="email" type="email" class="form-control" autocomplete="email" required />

        <label class="campo-etiqueta" for="password">Contraseña</label>
        <input th:field="*{password}" type="password" id="password" class="form-control"
          autocomplete="current-password" required />

        <button id="btn-login" class="btn btn-lg btn-primary btn-block" Type="Submit" disabled>Ingresar</button>

        <p th:if="${error != null}" class="alert alert-danger mt-3" th:text="'Error ' + ${error}">
        </p>
      </form>
      <a id="btn-register" class="ingreso-enlace" href="nuevo-usuario">Crear una cuenta</a>
    </section>
  </main>

  <th:block th:replace="~{fragmentos :: scripts}"></th:block>

  <script type="module" th:src="@{js/login.js}"></script>
</body>

</html>
