<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos :: cabecera('Mi membresía')}"></head>

<body>

  <nav th:replace="~{fragmentos :: barra('membresias')}"></nav>

  <main role="main" class="pagina">
    <header class="pagina-cabecera">
      <div>
        <h1>Mi membresía</h1>
        <p>Necesitás una membresía vigente para reservar clases.</p>
      </div>
    </header>

    <div th:if="${vigente != null}" class="pase">
      <span class="pase-tipo" th:text="${#strings.capitalize(#strings.toLowerCase(vigente.tipo))}">Mensual</span>
      <span>Vigente. Vence el <strong th:text="${#temporals.format(vigente.fechaVencimiento, 'dd/MM/yyyy')}">01/01/2026</strong></span>
    </div>
    <div th:if="${vigente == null}" class="pase pase-sin">
      <span class="pase-tipo">Sin membresía vigente</span>
      <span>Contratá un plan para volver a reservar.</span>
    </div>

    <form th:action="@{/membresias/guardar}" method="POST" class="formulario mb-5">
      <label class="campo-etiqueta" for="tipo">Contratar un plan</label>
      <select name="tipo" id="tipo" class="form-select" required>
        <option value="" disabled selected>Elegí un plan</option>
        <option th:each="t : ${T(com.tallerwebi.dominio.enums.TipoMembresia).values()}" th:value="${t}"
          th:text="${#strings.capitalize(#strings.toLowerCase(t))} + ' (' + ${t.meses} + (${t.meses == 1} ? ' mes' : ' meses') + ')'"></option>
      </select>
      <button id="btn-contratar" class="btn btn-primary" type="submit">Contratar</button>
    </form>

    <h5>Historial</h5>
    <div class="tabla-responsive" th:unless="${#lists.isEmpty(historial)}">
      <table class="tabla">
        <thead>
          <tr>
            <th>Plan</th>
            <th>Inicio</th>
            <th>Vencimiento</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="m : ${historial}">
            <td class="principal" th:text="${#strings.capitalize(#strings.toLowerCase(m.tipo))}">Mensual</td>
            <td th:text="${#temporals.format(m.fechaInicio, 'dd/MM/yyyy')}">01/01/2026</td>
            <td th:text="${#temporals.format(m.fechaVencimiento, 'dd/MM/yyyy')}">01/02/2026</td>
          </tr>
        </tbody>
      </table>
    </div>
    <p th:if="${#lists.isEmpty(historial)}" class="vacio">Todavía no tenés membresías.</p>
  </main>

  <th:block th:replace="~{fragmentos :: scripts}"></th:block>

</body>

</html>
