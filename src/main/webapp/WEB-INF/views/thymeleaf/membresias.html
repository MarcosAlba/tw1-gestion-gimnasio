<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <title>Taller Web I</title>

  <!-- Boostrap core css -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

  <!-- custom style -->
  <link rel="stylesheet" th:href="@{/css/main.css}" />

</head>

<body>

  <nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">
    <a class="navbar-brand" href="#">UNLAM</a>
  </nav>

  <main role="main" class="container">

    <div class="container" style="margin-top:50px;">
      <h3>Mi membresía</h3>
      <hr class="colorgraph">

      <div th:if="${vigente != null}" class="alert alert-success">
        Membresía vigente: <strong th:text="${vigente.tipo}"></strong>
        · vence el <span th:text="${#temporals.format(vigente.fechaVencimiento, 'dd/MM/yyyy')}"></span>
      </div>
      <div th:if="${vigente == null}" class="alert alert-warning">
        No tenés una membresía vigente.
      </div>

      <form th:action="@{/membresias/guardar}" method="POST" class="mb-4">
        <select name="tipo" id="tipo" class="form-control mb-2" required>
          <option value="" disabled selected>Tipo de membresía</option>
          <option th:each="t : ${T(com.tallerwebi.dominio.enums.TipoMembresia).values()}"
                  th:value="${t}" th:text="${t}"></option>
        </select>
        <button id="btn-contratar" class="btn btn-primary" type="submit">Contratar</button>
      </form>

      <h5>Historial</h5>
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Tipo</th>
            <th>Inicio</th>
            <th>Vencimiento</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="m : ${historial}">
            <td th:text="${m.tipo}"></td>
            <td th:text="${#temporals.format(m.fechaInicio, 'dd/MM/yyyy')}"></td>
            <td th:text="${#temporals.format(m.fechaVencimiento, 'dd/MM/yyyy')}"></td>
          </tr>
        </tbody>
      </table>
      <p th:if="${#lists.isEmpty(historial)}" class="text-muted">
        Todavía no tenés membresías.
      </p>
    </div>

  </main>
  <!-- /.container -->

  <!-- Boostrap core js -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
    crossorigin="anonymous"></script>

</body>

</html>
