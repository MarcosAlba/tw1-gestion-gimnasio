<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos :: cabecera('Nueva clase')}"></head>

<body>

  <nav th:replace="~{fragmentos :: barra('clases')}"></nav>

  <main role="main" class="pagina">
    <header class="pagina-cabecera">
      <div>
        <h1>Nueva clase</h1>
        <p>Definí el horario, el lugar y el cupo máximo. Quedás asignado como entrenador.</p>
      </div>
    </header>

    <form class="formulario" action="#" th:action="@{/clases/guardar}" method="POST" th:object="${datosClase}">
      <label class="campo-etiqueta" for="nombre">Nombre</label>
      <input th:field="*{nombre}" type="text" id="nombre" class="form-control" placeholder="Spinning" required />

      <label class="campo-etiqueta" for="inicio">Fecha y hora de inicio</label>
      <input th:field="*{inicio}" type="datetime-local" id="inicio" class="form-control" required />

      <label class="campo-etiqueta" for="duracion">Duración en minutos</label>
      <input th:field="*{duracion}" type="number" min="1" id="duracion" class="form-control" placeholder="45" required />

      <label class="campo-etiqueta" for="lugar">Lugar</label>
      <input th:field="*{lugar}" type="text" id="lugar" class="form-control" placeholder="Sala 1" required />

      <label class="campo-etiqueta" for="cupo">Cupo máximo</label>
      <input th:field="*{cupo}" type="number" min="1" id="cupo" class="form-control" placeholder="15" required />

      <label class="campo-etiqueta" for="capacidad">Capacidad que trabaja</label>
      <select th:field="*{capacidad}" id="capacidad" class="form-select" required>
        <option value="" disabled selected>Elegí una capacidad</option>
        <option th:each="c : ${T(com.tallerwebi.dominio.enums.CapacidadFisica).values()}" th:value="${c}"
          th:text="${c.name() == 'COORDINACION'} ? 'Coordinación' : ${#strings.capitalize(#strings.toLowerCase(c))}"></option>
      </select>

      <button id="btn-guardar" class="btn btn-lg btn-primary" Type="Submit">Guardar clase</button>
      <a class="btn btn-lg" th:href="@{/clases}">Cancelar</a>

      <p th:if="${error != null}" class="alert alert-danger mt-3" th:text="${error}"></p>
    </form>
  </main>

  <th:block th:replace="~{fragmentos :: scripts}"></th:block>

</body>

</html>
