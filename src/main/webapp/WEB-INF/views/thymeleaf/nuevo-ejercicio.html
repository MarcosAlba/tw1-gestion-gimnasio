<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos :: cabecera('Nuevo ejercicio')}"></head>

<body>

  <nav th:replace="~{fragmentos :: barra('ejercicios')}"></nav>

  <main role="main" class="pagina">
    <header class="pagina-cabecera">
      <div>
        <h1>Nuevo ejercicio</h1>
        <p>El nombre es obligatorio y no puede repetirse.</p>
      </div>
    </header>

    <form class="formulario" action="#" th:action="@{/ejercicios/guardar}" method="POST" th:object="${datosEjercicio}">
      <label class="campo-etiqueta" for="nombre">Nombre</label>
      <input th:field="*{nombre}" type="text" id="nombre" class="form-control" placeholder="Sentadilla con barra" required />

      <label class="campo-etiqueta" for="descripcion">Descripción (opcional)</label>
      <input th:field="*{descripcion}" type="text" id="descripcion" class="form-control" placeholder="Cómo se hace" />

      <label class="campo-etiqueta" for="capacidad">Capacidad que trabaja</label>
      <select th:field="*{capacidad}" id="capacidad" class="form-select" required>
        <option value="" disabled selected>Elegí una capacidad</option>
        <option th:each="c : ${T(com.tallerwebi.dominio.enums.CapacidadFisica).values()}" th:value="${c}"
          th:text="${c.name() == 'COORDINACION'} ? 'Coordinación' : ${#strings.capitalize(#strings.toLowerCase(c))}"></option>
      </select>

      <label class="campo-etiqueta" for="dificultad">Dificultad</label>
      <select th:field="*{dificultad}" id="dificultad" class="form-select" required>
        <option value="" disabled selected>Elegí una dificultad</option>
        <option th:each="d : ${T(com.tallerwebi.dominio.enums.NivelDificultad).values()}" th:value="${d}"
          th:text="${#strings.capitalize(#strings.toLowerCase(d))}"></option>
      </select>

      <button id="btn-guardar" class="btn btn-lg btn-primary" Type="Submit">Guardar ejercicio</button>
      <a class="btn btn-lg" th:href="@{/ejercicios}">Cancelar</a>

      <p th:if="${error != null}" class="alert alert-danger mt-3" th:text="${error}"></p>
    </form>
  </main>

  <th:block th:replace="~{fragmentos :: scripts}"></th:block>

</body>

</html>
