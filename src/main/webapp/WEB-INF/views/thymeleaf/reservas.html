<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos :: cabecera('Mis reservas')}"></head>

<body>

  <nav th:replace="~{fragmentos :: barra('reservas')}"></nav>

  <main role="main" class="pagina">
    <header class="pagina-cabecera">
      <div>
        <h1>Mis reservas</h1>
        <p>Cancelá una reserva para liberar tu lugar, o para salir de la lista de espera.</p>
      </div>
      <a th:href="@{/clases}" class="btn btn-primary">Ver clases</a>
    </header>

    <p th:if="${error != null}" class="alert alert-danger" th:text="${error}"></p>

    <div class="tabla-responsive" th:unless="${#lists.isEmpty(reservas)}">
      <table class="tabla">
        <thead>
          <tr>
            <th>Clase</th>
            <th>Inicio</th>
            <th class="d-none d-md-table-cell">Lugar</th>
            <th>Estado</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="r : ${reservas}">
            <td class="principal" th:text="${r.clase.nombre}">Spinning</td>
            <td th:text="${#temporals.format(r.clase.inicio, 'dd/MM/yyyy HH:mm')}">01/01/2026 18:00</td>
            <td class="d-none d-md-table-cell" th:text="${r.clase.lugar}">Sala 1</td>
            <td>
              <span class="estado"
                th:classappend="${r.estado.name() == 'CANCELADA'} ? 'estado-cancelada' : (${r.estado.name() == 'EN_ESPERA'} ? 'estado-espera' : '')"
                th:switch="${r.estado.name()}">
                <th:block th:case="'CONFIRMADA'">Confirmada</th:block>
                <th:block th:case="'EN_ESPERA'">En lista de espera</th:block>
                <th:block th:case="*">Cancelada</th:block>
              </span>
            </td>
            <td class="accion">
              <form th:if="${r.estado.name() != 'CANCELADA'}" th:action="@{/reservas/cancelar}" method="POST">
                <input type="hidden" name="reservaId" th:value="${r.id}" />
                <button class="btn btn-sm btn-outline-danger" type="submit">Cancelar</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <p th:if="${#lists.isEmpty(reservas)}" class="vacio">
      Todavía no tenés reservas.
      <a th:href="@{/clases}">Elegí una clase.</a>
    </p>
  </main>

  <th:block th:replace="~{fragmentos :: scripts}"></th:block>

</body>

</html>
