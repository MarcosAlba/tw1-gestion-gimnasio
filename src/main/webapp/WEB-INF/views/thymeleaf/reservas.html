<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <title>Taller Web I</title>

  <!-- Boostrap core css -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

  <!-- custom style -->
  <link rel="stylesheet" th:href="@{/css/main.css}" />

</head>

<body>

  <nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">
    <a class="navbar-brand" href="#">UNLAM</a>
  </nav>

  <main role="main" class="container">

    <div class="container" style="margin-top:50px;">
      <h3>Mis reservas</h3>
      <hr class="colorgraph">

      <p th:if="${error != null}" class="alert alert-danger" th:text="${error}"></p>

      <a th:href="@{/clases}" class="btn btn-primary mb-3">Ver clases para reservar</a>

      <table class="table table-striped">
        <thead>
          <tr>
            <th>Clase</th>
            <th>Inicio</th>
            <th>Lugar</th>
            <th>Estado</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="r : ${reservas}">
            <td th:text="${r.clase.nombre}"></td>
            <td th:text="${#temporals.format(r.clase.inicio, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${r.clase.lugar}"></td>
            <td th:text="${r.estado}"></td>
            <td>
              <form th:if="${r.estado.name() == 'CONFIRMADA'}" th:action="@{/reservas/cancelar}" method="POST">
                <input type="hidden" name="reservaId" th:value="${r.id}" />
                <button class="btn btn-sm btn-outline-danger" type="submit">Cancelar</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>

      <p th:if="${#lists.isEmpty(reservas)}" class="text-muted">
        Todavía no tenés reservas.
      </p>
    </div>

  </main>
  <!-- /.container -->

  <!-- Boostrap core js -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
    crossorigin="anonymous"></script>

</body>

</html>
