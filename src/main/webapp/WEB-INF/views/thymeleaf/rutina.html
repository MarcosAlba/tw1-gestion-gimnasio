<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>Taller Web I</title>

    <!-- Boostrap core css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

    <!-- custom style -->
    <link rel="stylesheet" th:href="@{/css/main.css}" />

</head>

<body>

<nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">
    <a class="navbar-brand" href="#">UNLAM</a>
</nav>

<main role="main" class="container">

    <div class="container" style="margin-top:50px;">
        <h3>Mi rutina</h3>
        <hr class="colorgraph">

        <form th:action="@{/rutina/generar}" method="POST">
            <button class="btn btn-primary mb-3" type="submit">Generar nueva rutina</button>
        </form>

        <p th:if="${error != null}" class="alert alert-danger" th:text="${error}"></p>

        <div th:if="${rutina != null}">
            <p class="text-muted">
                Deporte: <span th:text="${rutina.deporte}"></span> ·
                Generada: <span th:text="${#temporals.format(rutina.fechaCreacion, 'dd/MM/yyyy HH:mm')}"></span>
            </p>
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>Ejercicio</th>
                    <th>Capacidad</th>
                    <th>Dificultad</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="e : ${rutina.ejercicios}">
                    <td th:text="${e.nombre}"></td>
                    <td th:text="${e.capacidad}"></td>
                    <td th:text="${e.dificultad}"></td>
                </tr>
                </tbody>
            </table>
        </div>

        <p th:if="${rutina == null and error == null}" class="text-muted">
            Todavía no generaste ninguna rutina.
        </p>
    </div>

</main>
<!-- /.container -->

<!-- Boostrap core js -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>

</body>

</html>
