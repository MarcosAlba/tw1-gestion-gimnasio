<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos :: cabecera('Mi rutina')}"></head>

<body>

  <nav th:replace="~{fragmentos :: barra('rutina')}"></nav>

  <main role="main" class="pagina">
    <header class="pagina-cabecera">
      <div>
        <h1>Mi rutina</h1>
        <p>Los ejercicios se eligen según tu deporte. Cada vez que generás una rutina nueva, la anterior queda en el historial.</p>
      </div>
      <form th:action="@{/rutina/generar}" method="POST">
        <button class="btn btn-primary" type="submit">Generar nueva rutina</button>
      </form>
    </header>

    <p th:if="${error != null}" class="alert alert-danger" th:text="${error}"></p>

    <div th:if="${rutina != null}">
      <p class="meta">
        <span>Deporte: <strong th:text="${#strings.capitalize(#strings.toLowerCase(rutina.deporte))}">Tenis</strong></span>
        <span>Generada el <strong th:text="${#temporals.format(rutina.fechaCreacion, 'dd/MM/yyyy HH:mm')}">01/01/2026 10:00</strong></span>
      </p>

      <div class="tabla-responsive">
        <table class="tabla">
          <thead>
            <tr>
              <th>Ejercicio</th>
              <th>Capacidad</th>
              <th>Dificultad</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="e : ${rutina.ejercicios}">
              <td class="principal" th:text="${e.nombre}">Sentadilla</td>
              <td><th:block th:replace="~{fragmentos :: capacidad(${e.capacidad})}"></th:block></td>
              <td><th:block th:replace="~{fragmentos :: dificultad(${e.dificultad})}"></th:block></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <p th:if="${rutina == null and error == null}" class="vacio">
      Todavía no generaste ninguna rutina. Usá el botón de arriba para armar la primera.
    </p>
  </main>

  <th:block th:replace="~{fragmentos :: scripts}"></th:block>

</body>

</html>
